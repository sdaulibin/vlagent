services:
  backend:
    # 使用预构建的镜像（离线部署模式）
    image: harbor.devops.qdb.com/star/vl_flow_backend:0.1
    container_name: vl_flow_backend
    restart: always
    environment:
      # 数据库连接
      DATABASE_URL: ${DATABASE_URL}
      # AI 模型配置
      OPENAI_KEY: ${OPENAI_KEY}
      OPENAI_URL: ${OPENAI_URL}
      MODEL_LOCAL: ${MODEL_LOCAL}
      # 上传文件目录
      UPLOAD_DIR: /app/res
      # 识别超时时间（秒）
      RECOGNITION_TIMEOUT: ${RECOGNITION_TIMEOUT:-1800}
    volumes:
      # 绑定挂载：宿主机目录 -> 容器目录
      - /root/vl_flow/backend/res:/app/res
    ports:
      - "8000:8000"
    networks:
      - vl_flow_net

  frontend:
    # 使用预构建的镜像（离线部署模式）
    image: harbor.devops.qdb.com/star/vl_flow_front:0.1
    container_name: vl_flow_frontend
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - vl_flow_net

networks:
  vl_flow_net:
    driver: bridge
