services:
  backend:
    # 使用预构建的镜像（离线部署模式）
    image: harbor.devops.qdb.com/star/vlagent_backend:0.1
    container_name: vlagent_backend
    restart: always
    environment:
      # 数据库连接
      DATABASE_URL: ${DATABASE_URL}
      # AI 模型配置
      OPENAI_KEY: ${OPENAI_KEY}
      OPENAI_URL: ${OPENAI_URL}
      MODEL_LOCAL: ${MODEL_LOCAL}
      # 上传文件目录
      UPLOAD_DIR: /app/upload
      # 下载文件目录
      DOWNLOAD_DIR: /app/download
      # 识别超时时间（秒）
      RECOGNITION_TIMEOUT: ${RECOGNITION_TIMEOUT:-1800}
    volumes:
      # 绑定挂载：宿主机目录 -> 容器目录
      - /root/vlagent/backend/upload:/app/upload
      - /root/vlagent/backend/download:/app/download
    ports:
      - "8000:8000"
    networks:
      - vlagent_net

  frontend:
    # 使用预构建的镜像（离线部署模式）
    image: harbor.devops.qdb.com/star/vlagent_front:0.1
    container_name: vlagent_frontend
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - vlagent_net

networks:
  vlagent_net:
    driver: bridge
