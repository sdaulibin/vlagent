{{- if .Values.server.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vlagent.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vlagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    {{- if .Values.server.ingress.annotations }}
    {{- toYaml .Values.server.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.server.ingress.className }}
  rules:
    {{- range .Values.server.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $.Values.fullnameOverride }}-server
                port:
                  name: {{ .servicePortName }}
          {{- end }}
    {{- end }}
  {{- if .Values.server.ingress.tls }}
  tls:
    {{- toYaml .Values.server.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
