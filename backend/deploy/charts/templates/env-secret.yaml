{{- if .Values.secret }}
{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vlagent-backend.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # ==============================================================================
  # 数据库连接串
  # ==============================================================================
  DATABASE_URL: {{ .Values.secret.DATABASE_URL | default "" | quote }}
  DATABASE_UPSTREAM_URL: {{ .Values.secret.DATABASE_UPSTREAM_URL | default "" | quote }}

  # ==============================================================================
  # AI 模型 API Key
  # ==============================================================================
  # OPENAI_KEY: {{ .Values.secret.OPENAI_KEY | default "" | quote }}

  # ==============================================================================
  # Qwen3.5 API Key
  # ==============================================================================
  QWEN35_KEY: {{ .Values.secret.QWEN35_KEY | default "" | quote }}

  # ==============================================================================
  # JWT 签名密钥
  # ==============================================================================
  JWT_SECRET: {{ .Values.secret.JWT_SECRET | default "" | quote }}

  # ==============================================================================
  # 上游数据同步
  # ==============================================================================
  SYNC_INTERVAL_MINUTES: {{ .Values.secret.SYNC_INTERVAL_MINUTES | default "5" | quote }}

  # ==============================================================================
  # 影像平台密码
  # ==============================================================================
  ECM_PASSWORD: {{ .Values.secret.ECM_PASSWORD | default "" | quote }}
{{- end }}
{{- end }}
