<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银行流水信息识别</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 内置图标组件 (解决 Lucide 外部加载报错问题) ---
        const IconUpload = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
        );
        const IconFileText = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>
            </svg>
        );
        const IconCheckCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
        );
        const IconClock = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
        );
        const IconTrash2 = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
        );
        const IconShieldCheck = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
            </svg>
        );
        const IconFileSpreadsheet = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/>
            </svg>
        );
        const IconAlertCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        );

        function App() {
            const [files, setFiles] = useState([]);
            const [results, setResults] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);

            // 模拟识别结果数据
            const mockResults = [
                { id: 1, date: "2023-10-24", type: "转账汇款", amount: "-5,000.00", balance: "24,500.00", desc: "支付宝转账-张三" },
                { id: 2, date: "2023-10-25", type: "工资入账", amount: "+12,000.00", balance: "36,500.00", desc: "XX科技有限公司-10月工资" },
                { id: 3, date: "2023-10-26", type: "消费支出", amount: "-328.50", balance: "36,171.50", desc: "沃尔玛超市购物" },
                { id: 4, date: "2023-10-27", type: "理财赎回", amount: "+50,000.00", balance: "86,171.50", desc: "招商银行理财赎回" },
                { id: 5, date: "2023-10-28", type: "其他支出", amount: "-100.00", balance: "86,071.50", desc: "手机话费充值" },
            ];

            const handleFileUpload = (e) => {
                const newFiles = Array.from(e.target.files).map(file => ({
                    name: file.name,
                    size: (file.size / 1024).toFixed(2) + ' KB',
                    status: 'uploading',
                    id: Date.now() + Math.random()
                }));

                if (newFiles.length === 0) return;

                setFiles(prev => [...prev, ...newFiles]);
                setIsProcessing(true);

                // 模拟上传和处理过程
                setTimeout(() => {
                    setFiles(prev => prev.map(f => ({ ...f, status: 'done' })));
                    setResults(mockResults);
                    setIsProcessing(false);
                }, 1500);
            };

            const handleDeleteFile = (id) => {
                setFiles(files.filter(f => f.id !== id));
                if (files.length <= 1) {
                    setResults([]); // 清空结果如果没文件了
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col items-center">
                    
                    {/* Header */}
                    <header className="w-full max-w-6xl mb-8 flex items-center gap-3">
                        <div className="bg-blue-600 p-2 rounded-lg shadow-lg">
                            <IconShieldCheck className="text-white w-8 h-8" />
                        </div>
                        <h1 className="text-3xl font-bold text-gray-800 tracking-tight">银行流水信息识别</h1>
                    </header>

                    {/* Main Content Grid */}
                    <main className="w-full max-w-6xl grid grid-cols-1 md:grid-cols-12 gap-6 h-[80vh]">
                        
                        {/* Left Column: Upload & List (占据 4/12) */}
                        <div className="md:col-span-4 flex flex-col gap-6">
                            
                            {/* File Upload Section */}
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col h-1/3">
                                <h2 className="text-lg font-semibold text-gray-700 mb-3 flex items-center gap-2">
                                    <IconUpload className="w-5 h-5 text-blue-500" />
                                    文件上传
                                </h2>
                                <div className="flex-1 border-2 border-dashed border-blue-200 rounded-lg bg-blue-50 hover:bg-blue-100 transition-colors cursor-pointer relative group flex flex-col items-center justify-center text-center p-4">
                                    <input 
                                        type="file" 
                                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" 
                                        onChange={handleFileUpload}
                                        multiple
                                    />
                                    <div className="bg-white p-3 rounded-full shadow-sm mb-3 group-hover:scale-110 transition-transform">
                                        <IconFileSpreadsheet className="w-8 h-8 text-blue-500" />
                                    </div>
                                    <p className="text-sm font-medium text-gray-600">点击或拖拽上传流水文件</p>
                                    <p className="text-xs text-gray-400 mt-1">支持 PDF, JPG, PNG 格式</p>
                                </div>
                            </div>

                            {/* File List Section */}
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col flex-1 h-2/3">
                                <h2 className="text-lg font-semibold text-gray-700 mb-3 flex items-center gap-2">
                                    <IconFileText className="w-5 h-5 text-blue-500" />
                                    文件列表
                                </h2>
                                <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-3">
                                    {files.length === 0 ? (
                                        <div className="h-full flex flex-col items-center justify-center text-gray-400">
                                            <p>暂无文件</p>
                                        </div>
                                    ) : (
                                        files.map(file => (
                                            <div key={file.id} className="bg-gray-50 rounded-lg p-3 flex items-center justify-between group border border-gray-100 hover:border-blue-200 transition-all">
                                                <div className="flex items-center gap-3 overflow-hidden">
                                                    <div className={`p-2 rounded-md ${file.status === 'done' ? 'bg-green-100' : 'bg-yellow-100'}`}>
                                                        <IconFileText className={`w-5 h-5 ${file.status === 'done' ? 'text-green-600' : 'text-yellow-600'}`} />
                                                    </div>
                                                    <div className="flex flex-col min-w-0">
                                                        <span className="text-sm font-medium text-gray-700 truncate w-32 md:w-40">{file.name}</span>
                                                        <span className="text-xs text-gray-400">{file.size}</span>
                                                    </div>
                                                </div>
                                                <button 
                                                    onClick={() => handleDeleteFile(file.id)}
                                                    className="text-gray-400 hover:text-red-500 p-1 rounded-full hover:bg-red-50 transition-colors"
                                                >
                                                    <IconTrash2 className="w-4 h-4" />
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Right Column: Recognition Results (占据 8/12) */}
                        <div className="md:col-span-8 bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col h-full">
                            <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center justify-between">
                                <span className="flex items-center gap-2">
                                    <IconCheckCircle className="w-6 h-6 text-green-500" />
                                    识别结果
                                </span>
                                {isProcessing && (
                                    <span className="text-sm font-normal text-blue-600 flex items-center gap-2 animate-pulse">
                                        <IconClock className="w-4 h-4" />
                                        AI正在分析数据...
                                    </span>
                                )}
                            </h2>
                            
                            <div className="flex-1 overflow-hidden bg-gray-50 rounded-lg border border-gray-200 flex flex-col">
                                {results.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center text-gray-400 space-y-4">
                                        <div className="bg-gray-100 p-6 rounded-full">
                                            <IconAlertCircle className="w-12 h-12 text-gray-300" />
                                        </div>
                                        <p>请在左侧上传文件以开始识别</p>
                                    </div>
                                ) : (
                                    <div className="overflow-auto custom-scrollbar h-full p-4">
                                        {/* 模拟草图中的 1. 2. 3. 列表结构 */}
                                        <div className="space-y-4">
                                            {results.map((item, index) => (
                                                <div key={item.id} className="bg-white p-4 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                                                    <div className="flex items-start gap-4">
                                                        <div className="flex-shrink-0 w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold">
                                                            {index + 1}
                                                        </div>
                                                        <div className="flex-1 grid grid-cols-2 md:grid-cols-4 gap-4">
                                                            <div>
                                                                <p className="text-xs text-gray-400">交易日期</p>
                                                                <p className="font-medium text-gray-700">{item.date}</p>
                                                            </div>
                                                            <div>
                                                                <p className="text-xs text-gray-400">交易类型</p>
                                                                <span className="inline-block px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-600">
                                                                    {item.type}
                                                                </span>
                                                            </div>
                                                            <div>
                                                                <p className="text-xs text-gray-400">交易金额</p>
                                                                <p className={`font-bold ${item.amount.startsWith('+') ? 'text-red-500' : 'text-green-600'}`}>
                                                                    {item.amount}
                                                                </p>
                                                            </div>
                                                            <div>
                                                                <p className="text-xs text-gray-400">摘要/备注</p>
                                                                <p className="text-sm text-gray-600 truncate">{item.desc}</p>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                            
                                            <div className="text-center py-4 text-gray-400 text-sm">
                                                - 已显示全部识别结果 -
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                            
                            {/* Bottom Actions Mock */}
                            <div className="mt-4 pt-4 border-t border-gray-100 flex justify-end gap-3">
                                <button className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">导出 Excel</button>
                                <button className="px-4 py-2 text-sm text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm">确认归档</button>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
