replicaCount: 1

image:
  repository: harbor.devops.qdb.com/star/vlagent-frontend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "vlagent-frontend"

podAnnotations: {}

podSecurityContext: {}

hostNetwork: false
command: ["/usr/local/openresty/bin/openresty"]
args: ["-g", "daemon off;", "-c", "/usr/local/openresty/nginx/conf/nginx.conf"]

config: |
  worker_processes auto;
  events {
    worker_connections 1024;
  }

  http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    server {
        listen 8001;
        server_name localhost;
        root /usr/local/openresty/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
    }
  }

ports:
  - name: http
    containerPort: 8001
    protocol: TCP

service:
  type: ClusterIP
  port:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001

ingress:
  enabled: false

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

envs:
  - name: LUAJIT_LIB
    value: "/usr/local/openresty/luajit/lib"
  - name: LUAJIT_INC
    value: "/usr/local/openresty/luajit/include/luajit-2.1"

hostAliases: {}

volumeMounts:
  - mountPath: /usr/local/openresty/nginx/conf/nginx.conf
    name: config
    subPath: nginx.conf

volumes:
  - configMap:
      name: vlagent-frontend-config
    name: config
